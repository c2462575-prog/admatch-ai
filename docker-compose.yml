version: '3.8'

services:
  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db_data:/app/data

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  db_data:
